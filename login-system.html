<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login System</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 30px; border-radius: 10px; width: 300px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    input { width: 100%; padding: 10px; margin: 6px 0 14px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2f5bff; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #msg { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="box">
    <h1>Login System</h1>

    <label>Username</label>
    <input id="username" type="text">

    <label>Password</label>
    <input id="password" type="password">

    <button onclick="handleLogin()">Login</button>
    <p id="msg"></p>
  </div>

  <script>
    function login(username, password) {

      let user = "kamlesh"
      let pass = "123456"
      let errors = []
      if (!username) {
        errors.push("User Name is Required")
      }
      if (!password) {
        errors.push("Password is Required")
      }

      if (password && password.length < 6) {
        errors.push("Password must be at least 6 characters");
      }

      if (username && user !== username) {
        errors.push("Wrong Username")
      }
      if (password && pass !== password) {
        errors.push("Wrong Password")
      }
      if (errors.length > 0) {
        throw new Error(errors.join(" and "))
      }
      return ("Login Successful")
    }

    function handleLogin() {
      const msg = document.getElementById("msg")
      try {
        let username = document.getElementById("username").value
        let password = document.getElementById("password").value

        const result = login(username, password)
        console.log(result)
        msg.style.color = "green"
        msg.textContent = result
      }
      catch (error) {
        console.log("Login Error", error.message)
        msg.style.color = "red"
        msg.textContent = error.message
      }
      finally {
        console.log("Finish")
      }
    }
  </script>

</body>
</html>
